<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EscalaMed — Cadastro Profissional</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex min-h-screen">
    <div class="hidden lg:flex w-1/2 bg-emerald-50 p-16 flex-col justify-between border-r border-emerald-100">
        <div>
            <span class="text-emerald-700 font-bold text-xl">✚ EscalaMed</span>
        </div>
        <div>
            <span class="bg-emerald-200 text-emerald-900 text-xs font-semibold px-3 py-1 rounded-full">Acesso profissional</span>
            <h1 class="text-4xl font-bold text-gray-900 mt-4 mb-4">Sua identidade e seus vínculos, verificados com segurança.</h1>
            <p class="text-gray-700">O EscalaMed confirma CPF, categoria e registro profissional antes de liberar escalas e solicitações sensíveis.</p>
        </div>
        <div class="text-xs text-gray-500">Protegido por criptografia e LGPD.</div>
    </div>

    <div class="w-full lg:w-1/2 flex items-center justify-center p-8">
        <div class="bg-white border border-gray-200 rounded-2xl p-8 shadow-sm w-full max-w-lg">
            <span class="text-xs bg-gray-100 text-gray-600 px-2.5 py-1 rounded-md font-medium">Etapa 1 de 2</span>
            <h2 class="text-2xl font-bold text-gray-900 mt-3 mb-6">Cadastre seu perfil profissional</h2>
            
            <form id="doctorForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" class="w-full border border-gray-300 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500" required>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Categoria</label>
                        <select id="category" class="w-full border border-gray-300 rounded-xl p-3 text-sm bg-white focus:outline-none focus:border-emerald-500">
                            <option>Médico(a)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Conselho</label>
                        <select id="council" class="w-full border border-gray-300 rounded-xl p-3 text-sm bg-white focus:outline-none focus:border-emerald-500">
                            <option>CRM</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Número de registro</label>
                    <input type="text" id="registry" placeholder="SC 000000" class="w-full border border-gray-300 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">E-mail profissional</label>
                    <input type="email" id="email" placeholder="nome@hospital.com.br" class="w-full border border-gray-300 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                    <input type="password" id="password" placeholder="Mínimo de 8 caracteres" class="w-full border border-gray-300 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500" required>
                </div>
                <button type="submit" class="w-full bg-emerald-600 text-white font-medium py-3 rounded-xl hover:bg-emerald-700 transition mt-2">Validar dados e continuar</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('doctorForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                cpf: document.getElementById('cpf').value,
                category: document.getElementById('category').value,
                council: document.getElementById('council').value,
                registry: document.getElementById('registry').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            const response = await fetch('/api/register-doctor', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            if (result.success) {
                alert('Cadastro realizado com sucesso!');
                window.location.href = 'painel-medico.html';
            } else {
                alert('Erro: ' + result.error);
            }
        });
    </script>
</body>
</html>
