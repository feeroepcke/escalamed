<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EscalaMed — Painel do Médico</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col justify-between">
    <!-- Cabeçalho -->
    <header class="bg-white border-b border-gray-200 px-8 py-4 flex justify-between items-center">
        <div class="text-emerald-600 font-bold text-xl">✚ EscalaMed <span class="text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-normal ml-2">Painel Médico</span></div>
        <button onclick="logout()" class="text-sm text-red-600 hover:text-red-700 font-medium">Sair</button>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-5xl mx-auto p-6 w-full flex-1 space-y-6">
        <div class="bg-white border border-gray-200 rounded-2xl p-8 shadow-sm">
            <h1 class="text-2xl font-bold text-gray-900 mb-1">Painel de Plantões e Escalas</h1>
            <p id="doctorWelcome" class="text-gray-600 text-sm">Carregando dados do profissional...</p>
        </div>

        <div class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm">
            <h2 class="text-lg font-bold text-gray-900 mb-4">Seus Próximos Plantões</h2>
            <div class="border border-gray-100 rounded-xl p-4 bg-gray-50 text-sm text-gray-600">
                Nenhum plantão alocado no momento. O calendário de escalas do setor será exibido aqui.
            </div>
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="bg-white border-t border-gray-200 py-4 text-center text-xs text-gray-400">
        EscalaMed — Gestão inteligente e transparente de escalas médicas.
    </footer>

    <script>
        const doctorData = localStorage.getItem('doctor_user');
        if (doctorData) {
            const doctor = JSON.parse(doctorData);
            document.getElementById('doctorWelcome').textContent = `Bem-vindo(a), ${doctor.email}`;
        }

        function logout() {
            localStorage.removeItem('doctor_user');
            window.location.href = 'medico.html';
        }
    </script>
</body>
</html>
