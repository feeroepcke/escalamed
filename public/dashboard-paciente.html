<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EscalaMed - Acompanhamento do Paciente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans">
    <nav class="bg-teal-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-hospital-user text-2xl"></i>
                <span class="font-bold text-xl tracking-tight">EscalaMed | Portal do Paciente</span>
            </div>
            <a href="paciente.html" class="bg-teal-700 hover:bg-teal-800 px-3 py-1.5 rounded-lg text-sm transition">Sair</a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <!-- Card da Senha / Fila -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 text-center mb-8">
            <span class="text-xs font-semibold px-3 py-1 rounded-full bg-teal-100 text-teal-800">Atendimento em Andamento</span>
            <h1 class="text-5xl font-extrabold text-gray-800 mt-4 tracking-tight">A-042</h1>
            <p class="text-gray-500 text-sm mt-1">Sua Senha Atual</p>

            <div class="grid grid-cols-2 gap-4 max-w-sm mx-auto mt-6 pt-6 border-t border-gray-100">
                <div>
                    <p class="text-2xl font-bold text-teal-600">3</p>
                    <p class="text-xs text-gray-500">Pessoas na sua frente</p>
                </div>
                <div>
                    <p class="text-2xl font-bold text-teal-600">~15 min</p>
                    <p class="text-xs text-gray-500">Tempo estimado</p>
                </div>
            </div>
        </div>

        <!-- Médicos de Plantão na Unidade -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
            <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center space-x-2">
                <i class="fa-solid fa-user-nurse text-teal-600"></i>
                <span>Equipe Médica de Plantão Hoje</span>
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="p-4 rounded-xl bg-gray-50 border border-gray-100 flex items-center space-x-4">
                    <div class="bg-teal-100 p-3 rounded-full text-teal-700">
                        <i class="fa-solid fa-stethoscope"></i>
                    </div>
                    <div>
                        <p class="font-semibold text-gray-800">Dr. Roberto Silva</p>
                        <p class="text-xs text-gray-500">Clínica Geral • CRM 123456</p>
                    </div>
                </div>

                <div class="p-4 rounded-xl bg-gray-50 border border-gray-100 flex items-center space-x-4">
                    <div class="bg-teal-100 p-3 rounded-full text-teal-700">
                        <i class="fa-solid fa-baby"></i>
                    </div>
                    <div>
                        <p class="font-semibold text-gray-800">Dra. Mariana Costa</p>
                        <p class="text-xs text-gray-500">Pediatria • CRM 654321</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
